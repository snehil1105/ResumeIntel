version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resumeintel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resumeintel_db}
      POSTGRES_USER: ${POSTGRES_USER:-resumeintel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resumeintel_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resumeintel_user} -d ${POSTGRES_DB:-resumeintel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumeintel-network

  redis:
    image: redis:7-alpine
    container_name: resumeintel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - resumeintel-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resumeintel-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-resumeintel_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-resumeintel_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-resumeintel_secure_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
      JWT_EXPIRATION_HOURS: 24
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - resumeintel-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: resumeintel-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-resumeintel_user}:${POSTGRES_PASSWORD:-resumeintel_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-resumeintel_db}
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-gemini}
      PORT: 8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ai_storage:/app/storage
    networks:
      - resumeintel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resumeintel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    networks:
      - resumeintel-network

networks:
  resumeintel-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ai_storage:
